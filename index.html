<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minimalist Banana Line Art</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #000000;
        font-family: "Helvetica Neue", Arial, sans-serif;
        padding: 2rem;
      }
      svg {
        width: min(80vw, 600px);
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <svg
      viewBox="0 0 600 260"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-labelledby="title desc"
    >
      <title id="title">Minimalist Banana Line Art</title>
      <desc id="desc">
        A horizontally oriented banana drawn with smooth black lines of varying
        thickness on a white background.
      </desc>
      <g
        fill="none"
        stroke="#000"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          stroke-width="9"
          d="M60 164c46 52 226 96 388 14"
        />
        <path
          stroke-width="7"
          d="M72 148c53-74 246-118 424-42"
        />
        <path
          stroke-width="4"
          d="M118 154c60 40 210 64 320 4"
          opacity="0.9"
        />
        <path
          stroke-width="5"
          d="M62 162c-12-24-12-46 18-54"
        />
        <path
          stroke-width="4.5"
          d="M496 126c26-26 44-28 64-6"
        />
        <path
          stroke-width="3"
          d="M558 120c-6 32-32 64-84 72"
          opacity="0.85"
        />
      </g>
    </svg>
  </body>
</html>
